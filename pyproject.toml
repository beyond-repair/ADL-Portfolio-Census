[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adl-portfolio-census"
version = "0.1.2"
description = "Deterministic SCAN/FORK/ANCHOR census for the beyond-repair portfolio."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["census*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]
